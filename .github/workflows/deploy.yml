name: Publicar el museo en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzar el despliegue a mano desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan varios commits seguidos, se publica el último y se cancelan los previos.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 7 exige Node >= 22.12.
          node-version: 22
          cache: npm

      - run: npm ci

      # PAGES=1 activa el prefijo /CarreteMuseoflamenco en astro.config.mjs.
      - run: npm run build
        env:
          PAGES: '1'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
